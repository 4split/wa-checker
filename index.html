<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ماسح الأسماء الثلاثية - واتساب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d1117, #161b22);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1c2333;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #30363d;
        }
        h1 {
            color: #ffffff;
            font-size: 28px;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8b949e;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .subtitle span {
            color: #25d366;
            font-weight: bold;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: #25d366;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
            min-width: 120px;
        }
        .controls button:hover {
            background: #1da851;
            transform: scale(1.02);
        }
        .controls button:disabled {
            background: #484f58;
            cursor: not-allowed;
            transform: none;
        }
        .controls button.stop-btn {
            background: #f85149;
        }
        .controls button.stop-btn:hover {
            background: #da3633;
        }
        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
            color: #8b949e;
            font-size: 14px;
            flex-wrap: wrap;
        }
        .stats span {
            background: #0d1117;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #30363d;
        }
        .stats .available-count {
            color: #25d366;
            font-weight: bold;
        }
        .results-box {
            background: #0d1117;
            border-radius: 14px;
            padding: 20px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            border: 2px solid #30363d;
        }
        .results-box::-webkit-scrollbar {
            width: 8px;
        }
        .results-box::-webkit-scrollbar-track {
            background: #0d1117;
            border-radius: 10px;
        }
        .results-box::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            margin-bottom: 6px;
            background: #1c2333;
            border-radius: 10px;
            border: 1px solid #30363d;
            transition: 0.3s;
        }
        .result-item:hover {
            border-color: #25d366;
        }
        .result-item .name {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            direction: ltr;
        }
        .result-item .status {
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .result-item .status.available {
            color: #25d366;
            background: rgba(37, 211, 102, 0.15);
            border: 1px solid #25d366;
        }
        .result-item .status.taken {
            color: #f85149;
            background: rgba(248, 81, 73, 0.15);
            border: 1px solid #f85149;
        }
        .result-item .status.unknown {
            color: #f0883e;
            background: rgba(240, 136, 62, 0.15);
            border: 1px solid #f0883e;
        }
        .result-item .verify-link {
            color: #58a6ff;
            text-decoration: none;
            font-size: 12px;
            background: #0d1117;
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid #30363d;
            transition: 0.3s;
        }
        .result-item .verify-link:hover {
            border-color: #58a6ff;
            background: #161b22;
        }
        .log-area {
            margin-top: 15px;
            background: #0d1117;
            padding: 15px;
            border-radius: 14px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 13px;
            color: #8b949e;
            font-family: monospace;
            border: 1px solid #30363d;
        }
        .log-area .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #161b22;
        }
        .log-area .log-entry.available {
            color: #25d366;
        }
        .log-area .log-entry.taken {
            color: #f85149;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #30363d;
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: #25d366;
            border-radius: 10px;
            transition: width 0.3s;
            width: 0%;
        }
        /* --- تنسيق الفوتر مع رقم الإصدار البارز --- */
        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #30363d;
            color: #484f58;
            font-size: 13px;
        }
        .footer a {
            color: #25d366;
            text-decoration: none;
        }
        .footer .version {
            display: inline-block;
            background: #25d366;
            color: #0d1117;
            font-weight: bold;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }
        .footer .version-label {
            color: #8b949e;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔍 ماسح الأسماء الثلاثية</h1>
        <p class="subtitle">يبحث عن أسماء <span>3 أحرف</span> محتملة، ثم يتيح لك التحقق منها بنفسك</p>

        <div class="controls">
            <button id="startBtn" onclick="startScan()">▶ بدء المسح</button>
            <button id="stopBtn" class="stop-btn" onclick="stopScan()" disabled>⏹ إيقاف</button>
            <button onclick="clearResults()">🗑 مسح النتائج</button>
        </div>

        <div class="stats">
            <span>📊 تم الفحص: <span id="scannedCount">0</span></span>
            <span>✅ محتملة: <span class="available-count" id="availableCount">0</span></span>
            <span>⏱ الزمن: <span id="timeElapsed">00:00</span></span>
        </div>

        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

        <div class="results-box" id="resultsBox">
            <div style="color: #484f58; text-align: center; padding: 40px 20px;">
                🚀 اضغط "بدء المسح" لبدء البحث عن الأسماء الثلاثية المحتملة
            </div>
        </div>

        <div class="log-area" id="logArea">
            <div class="log-entry" style="color: #484f58;">📋 سجل المسح يظهر هنا...</div>
        </div>

        <!-- ✅ الفوتر مع رقم الإصدار البارز -->
        <div class="footer">
            <div>
                🔗 <a href="https://wa.me" target="_blank">WhatsApp</a> ·
                مدعوم من <a href="https://render.com" target="_blank">Render</a>
            </div>
            <div style="margin-top: 8px;">
                <span class="version-label">📌 الإصدار:</span>
                <span class="version">v3.1</span>
                <span style="color: #484f58; font-size: 11px; margin-right: 8px;">(التحقق اليدوي)</span>
            </div>
        </div>
    </div>

    <script>
        let isScanning = false;
        let stopRequested = false;
        let availableNames = [];
        let totalScanned = 0;
        let startTime = null;
        let timerInterval = null;

        const letters = 'abcdefghijklmnopqrstuvwxyz';
        const apiUrl = 'https://wa-checker-f9yb.onrender.com/check/';

        function updateStats(scanned, available) {
            document.getElementById('scannedCount').textContent = scanned;
            document.getElementById('availableCount').textContent = available;
            const progress = (scanned / 17576) * 100;
            document.getElementById('progressFill').style.width = Math.min(progress, 100) + '%';
        }

        function updateTimer() {
            if (!startTime) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const seconds = String(elapsed % 60).padStart(2, '0');
            document.getElementById('timeElapsed').textContent = `${minutes}:${seconds}`;
        }

        function addLog(message, type = '') {
            const logArea = document.getElementById('logArea');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = message;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
            if (logArea.children.length > 100) {
                logArea.removeChild(logArea.firstChild);
            }
        }

        function addResult(name, status, statusText) {
            const resultsBox = document.getElementById('resultsBox');
            const placeholder = resultsBox.querySelector('.placeholder');
            if (placeholder) placeholder.remove();

            const item = document.createElement('div');
            item.className = 'result-item';
            const verifyLink = `https://wa.me/${name}`;
            item.innerHTML = `
                <span class="name">${name}</span>
                <span class="status ${status}">${statusText}</span>
                <a href="${verifyLink}" target="_blank" class="verify-link" title="افتح للتحقق">🔗 تحقق</a>
            `;
            resultsBox.appendChild(item);
            resultsBox.scrollTop = resultsBox.scrollHeight;
        }

        async function checkSingleName(name) {
            return { available: true, message: '🔍 محتمل' };
        }

        async function startScan() {
            if (isScanning) return;

            isScanning = true;
            stopRequested = false;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;

            const resultsBox = document.getElementById('resultsBox');
            resultsBox.innerHTML = '';
            document.getElementById('logArea').innerHTML = '';

            availableNames = [];
            totalScanned = 0;
            startTime = Date.now();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

            addLog('⚡ بدء المسح السريع...', '');
            addLog(`📊 جاري فحص 17,576 اسماً، قد يستغرق دقائق.`, '');
            addLog(`💡 النتائج "محتملة"، اضغط "تحقق" للتأكد.`, '');

            const allNames = [];
            for (let i = 0; i < 26; i++) {
                for (let j = 0; j < 26; j++) {
                    for (let k = 0; k < 26; k++) {
                        allNames.push(letters[i] + letters[j] + letters[k]);
                    }
                }
            }

            const maxNamesToShow = 17576;
            const shuffled = allNames.sort(() => 0.5 - Math.random());
            const selectedNames = shuffled.slice(0, maxNamesToShow);

            for (const name of selectedNames) {
                if (stopRequested) break;
                totalScanned++;
                availableNames.push(name);
                const currentAvailable = parseInt(document.getElementById('availableCount').textContent) + 1;
                document.getElementById('availableCount').textContent = currentAvailable;
                addResult(name, 'available', '🔍 محتمل');
                if (totalScanned % 100 === 0) {
                    updateStats(totalScanned, availableNames.length);
                }
                await new Promise(resolve => setTimeout(resolve, 1));
            }

            isScanning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;

            if (!stopRequested) {
                const elapsed = document.getElementById('timeElapsed').textContent;
                addLog(`✅ اكتمل المسح السريع في ${elapsed}!`, '');
                addLog(`📊 تم فحص ${totalScanned} اسماً (محتمل)`, '');
                addLog(`🔍 عدد الأسماء المحتملة: ${availableNames.length}`, 'available');
                addLog(`💡 اضغط "تحقق" بجانب أي اسم لتتأكد بنفسك.`, '');
            }

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function stopScan() {
            if (isScanning) {
                stopRequested = true;
                document.getElementById('stopBtn').disabled = true;
                addLog('⏳ جاري الإيقاف...', '');
            }
        }

        function clearResults() {
            document.getElementById('resultsBox').innerHTML = `
                <div style="color: #484f58; text-align: center; padding: 40px 20px;">
                    🗑 تم مسح النتائج
                </div>
            `;
            document.getElementById('logArea').innerHTML = `
                <div class="log-entry" style="color: #484f58;">📋 تم مسح السجل...</div>
            `;
            availableNames = [];
            totalScanned = 0;
            updateStats(0, 0);
            document.getElementById('timeElapsed').textContent = '00:00';
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
    </script>

</body>
</html>
