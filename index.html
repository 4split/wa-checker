<script>
    // متغير لتأخير البحث أثناء الكتابة
    let typingTimer;
    const doneTypingInterval = 500; // 0.5 ثانية بعد التوقف عن الكتابة

    // دالة البحث الرئيسية
    async function checkUsername() {
        const username = document.getElementById('username').value.trim();
        const resultDiv = document.getElementById('result');

        // إذا كان الاسم أقل من 3 أحرف، لا نبحث
        if (username.length < 3) {
            resultDiv.className = '';
            resultDiv.innerHTML = '✏️ اكتب 3 أحرف على الأقل للبحث التلقائي';
            return;
        }

        // حالة التحميل
        resultDiv.className = 'loading';
        resultDiv.innerHTML = '⏳ جاري التحقق...';

        try {
            const response = await fetch(`https://wa-checker-f9yb.onrender.com/check/${username}`);
            const data = await response.json();

            if (data.available) {
                resultDiv.className = 'available';
            } else {
                resultDiv.className = 'taken';
            }
            resultDiv.innerHTML = data.message;

        } catch (error) {
            resultDiv.className = 'error';
            resultDiv.innerHTML = '⚠️ حدث خطأ في الاتصال بالخادم. حاول مرة أخرى.';
            console.error('خطأ:', error);
        }
    }

    // دالة لملء حقل الإدخال بالأمثلة
    function fillExample(name) {
        document.getElementById('username').value = name;
        checkUsername();
    }

    // البحث التلقائي عند الكتابة
    document.getElementById('username').addEventListener('input', function(e) {
        clearTimeout(typingTimer);
        const username = this.value.trim();
        const resultDiv = document.getElementById('result');

        if (username.length < 3) {
            resultDiv.className = '';
            resultDiv.innerHTML = '✏️ اكتب 3 أحرف على الأقل للبحث التلقائي';
            return;
        }

        // انتظر 0.5 ثانية بعد توقف الكتابة ثم ابحث
        typingTimer = setTimeout(checkUsername, doneTypingInterval);
    });

    // السماح بالضغط على Enter أيضاً
    document.getElementById('username').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            clearTimeout(typingTimer);
            checkUsername();
        }
    });
</script>
